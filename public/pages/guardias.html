
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guardias | Gestión Transmetro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <br>
                        <h2>Gestión de Guardias</h2>
                        <p>
                            Consulta y administra los guardias de seguridad
                            asignados a los accesos de las estaciones.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-success"
                        id="btnNuevoGuardia"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Nuevo guardia
                    </button>
                </div>

                <!-- Tabla de guardias -->
                <div class="module-card">
                    
                    <!-- Controles de búsqueda y cantidad de registros -->
                    <div class="row g-3 align-items-center mb-3">

                        <div class="col-12 col-md-6">
                            <label for="buscarGuardias" class="form-label">
                                Buscar guardia
                            </label>

                            <input
                                type="search"
                                class="form-control"
                                id="buscarGuardias"
                                placeholder="Buscar por nombre, teléfono, acceso o ID..."
                            >
                        </div>

                        <div class="col-12 col-md-3">
                            <label for="registrosPorPaginaGuardias" class="form-label">
                                Registros por página
                            </label>

                            <select
                                class="form-select"
                                id="registrosPorPaginaGuardias"
                            >
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>

                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Teléfono</th>
                                    <th>Acceso</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaGuardias">
                                <tr>
                                    <td colspan="6" class="text-center">
                                        Cargando guardias...
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                    
                    <!-- Información de resultados y paginación -->
                    <div class="d-flex flex-column flex-md-row
                                justify-content-between align-items-center gap-3 mt-3">

                        <p
                            id="infoPaginacionGuardias"
                            class="mb-0 text-muted"
                            aria-live="polite"
                        >
                            Mostrando registros...
                        </p>

                        <nav aria-label="Paginación de guardias">
                            <ul
                                class="pagination pagination-sm mb-0"
                                id="paginacionGuardias"
                            >
                            </ul>
                        </nav>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Modal: Nuevo guardia / Editar guardia -->
    <div
        class="modal fade"
        id="modalGuardia"
        tabindex="-1"
        aria-labelledby="tituloModalGuardia"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalGuardia">
                        Nuevo guardia
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>
                </div>

                <form id="formGuardia">

                    <div class="modal-body">

                        <!-- Nombre del guardia -->
                        <div class="mb-3">
                            <label
                                for="nombreGuardia"
                                class="form-label"
                            >
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombreGuardia"
                                name="nombre"
                                maxlength="150"
                                placeholder="Ej. Carlos López"
                                required
                            >
                        </div>

                        <!-- Teléfono -->
                        <div class="mb-3">
                            <label
                                for="telefonoGuardia"
                                class="form-label"
                            >
                                Teléfono
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="telefonoGuardia"
                                name="telefono"
                                maxlength="20"
                                placeholder="Ej. 5555-1234"
                                required
                            >
                        </div>

                        <!-- Acceso asignado -->
                        <div class="mb-3">
                            <label
                                for="accesoGuardia"
                                class="form-label"
                            >
                                Acceso asignado
                            </label>

                            <select
                                class="form-select"
                                id="accesoGuardia"
                                name="id_acceso"
                                required
                            >
                                <option value="">
                                    Selecciona un acceso
                                </option>
                            </select>

                            <div class="form-text">
                                Solo se mostrarán accesos activos.
                            </div>
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-success"
                            id="btnGuardarGuardia"
                        >
                            Guardar guardia
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <!-- Lógica del módulo de guardias -->
    <script src="../js/modulos/guardias.js"></script>

    <!-- Cargar menú reutilizable -->
    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );
    </script>

</body>
</html>
