
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Gestión de alertas | Transmetro</title>
        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
        <!-- Iconos -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        >
        <!-- Estilos propios -->
        <link rel="stylesheet" href="../css/estilos.css">
    </head>

    <body>
        <div class="app-container">

            <!-- Menú lateral reutilizable -->
            <div id="contenedorMenu"></div>

            <!-- Área principal -->
            <main class="main-content">

                <!-- Encabezado reutilizable -->
                <div id="contenedorEncabezado"></div>

                <!-- Contenido del módulo -->
                <section class="content-section">

                    <div class="section-header">

                        <div>
                            <h2>Gestión de alertas</h2>

                            <p class="text-muted mb-0">
                                Consulta y administra las alertas generadas
                                durante la operación del sistema.
                            </p>
                        </div>

                    </div>

                    <!-- Mensajes de respuesta -->
                    <div
                        id="mensaje"
                        class="alert d-none"
                        role="alert"
                        aria-live="polite">
                    </div>

                    <!-- Búsqueda -->
                    
                    <!-- Búsqueda y cantidad de registros -->
                    <div class="card mb-3">
                        <div class="card-body">

                            <div class="row g-3 align-items-end">

                                <div class="col-md-8">
                                    <label for="buscarAlerta" class="form-label">
                                        Buscar alertas
                                    </label>

                                    <input
                                        type="search"
                                        class="form-control"
                                        id="buscarAlerta"
                                        placeholder="Buscar por estación, línea, tipo o estado..."
                                    >
                                </div>

                                <div class="col-md-4">
                                    <label for="registrosPorPagina" class="form-label">
                                        Registros por página
                                    </label>

                                    <select
                                        id="registrosPorPagina"
                                        class="form-select">

                                        <option value="5" selected>10 registros</option>
                                        <option value="10">25 registros</option>
                                        <option value="20">50 registros</option>
                                        <option value="50">100 registros</option>

                                    </select>
                                </div>

                            </div>

                        </div>
                    </div>

                    <!-- Tabla -->
                    <div class="card">

                        <div class="card-header d-flex
                                    justify-content-between align-items-center">

                            <h2 class="h6 mb-0">Alertas registradas</h2>

                            <button
                                type="button"
                                class="btn btn-outline-primary btn-sm"
                                id="btnActualizar">

                                <i class="bi bi-arrow-clockwise"></i>
                                Actualizar
                            </button>

                        </div>

                        <div class="table-responsive">

                                <table class="table table-striped
                                            table-hover align-middle mb-0">

                                    <thead class="table-light">
                                        <tr>
                                            <th scope="col">ID</th>
                                            <th scope="col">Estación</th>
                                            <th scope="col">Línea</th>
                                            <th scope="col">Tipo de alerta</th>
                                            <th scope="col">Fecha y hora</th>
                                            <th scope="col">Estado</th>
                                            <th scope="col">Acción</th>
                                        </tr>
                                    </thead>

                                    <tbody id="tablaAlertas">

                                        <tr>
                                            <td colspan="7" class="text-center py-4">
                                                Cargando alertas...
                                            </td>
                                        </tr>

                                    </tbody>

                                </table>

                            </div>

                            <!-- Paginación -->
                            <div class="card-footer">

                                <div class="d-flex flex-wrap
                                            justify-content-between align-items-center gap-2">

                                    <small
                                        id="infoPaginacion"
                                        class="text-muted">
                                        Sin datos
                                    </small>

                                    <nav aria-label="Paginación de alertas">
                                        <ul
                                            id="paginacion"
                                            class="pagination pagination-sm mb-0">
                                        </ul>
                                    </nav>

                                </div>

                            </div>
                        </div>
                </section>

            </main>
        </div>    

        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Conexión con la API -->
        <script src="../js/api.js"></script>

        <!-- Cargador de componentes -->
        <script src="../js/componentes.js"></script>

        <!-- Lógica del módulo -->
        <script src="../js/modulos/alertas.js"></script>

        <script>
            cargarComponente(
                "contenedorMenu",
                "../componentes/menu.html"
            );

            cargarComponente(
                "contenedorEncabezado",
                "../componentes/encabezado.html"
            );
        </script>

    </body>
</html>
