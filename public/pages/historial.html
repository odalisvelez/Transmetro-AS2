<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial educativo | Gestión Transmetro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <h2>Gestión de historial educativo</h2>
                        <p>
                            Consulta y administra la formación académica de los pilotos.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-success"
                        id="btnNuevoHistorial"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Nuevo historial
                    </button>
                    
                    <a
                        id="btnVolverPilotos"
                        href="pilotos.html"
                        class="btn btn-outline-secondary"
                        hidden
                    >
                        <i class="bi bi-arrow-left"></i>
                        Volver a Pilotos
                    </a>
                </div>

                <!-- Tabla de historiales educativos -->
                <div class="module-card">

                    <!-- Búsqueda y cantidad de registros -->
                    <div class="row g-3 align-items-center mb-3">

                        <div class="col-12 col-md-6">
                            <label for="buscarHistoriales" class="form-label">
                                Buscar historial
                            </label>

                            <input
                                type="search"
                                class="form-control"
                                id="buscarHistoriales"
                                placeholder="Buscar por institución, título o piloto..."
                            >
                        </div>

                        <div class="col-12 col-md-3">
                            <label
                                for="registrosPorPaginaHistoriales"
                                class="form-label"
                            >
                                Registros por página
                            </label>

                            <select
                                class="form-select"
                                id="registrosPorPaginaHistoriales"
                            >
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>

                    </div>

                    <!-- Tabla -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Institución</th>
                                    <th>Título obtenido</th>
                                    <th>Fecha de inicio</th>
                                    <th>Fecha de finalización</th>
                                    <th>Piloto</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaHistoriales">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        Cargando historiales educativos...
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                    <!-- Información y navegación de páginas -->
                    <div
                        class="d-flex flex-column flex-md-row
                               justify-content-between align-items-center
                               gap-3 mt-3"
                    >

                        <p
                            id="infoPaginacionHistoriales"
                            class="mb-0 text-muted"
                            aria-live="polite"
                        >
                            Mostrando registros...
                        </p>

                        <nav aria-label="Paginación de historiales educativos">
                            <ul
                                class="pagination pagination-sm mb-0"
                                id="paginacionHistoriales"
                            ></ul>
                        </nav>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Modal: Nuevo o editar historial educativo -->
    <div
        class="modal fade"
        id="modalHistorial"
        tabindex="-1"
        aria-labelledby="tituloModalHistorial"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalHistorial">
                        Nuevo historial educativo
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>
                </div>

                <form id="formHistorial">
                    <div class="modal-body">

                        <!-- Institución -->
                        <div class="mb-3">
                            <label
                                for="institucionHistorial"
                                class="form-label"
                            >
                                Institución educativa
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="institucionHistorial"
                                name="institucion"
                                maxlength="150"
                                placeholder="Ej. Instituto Técnico"
                                required
                            >
                        </div>

                        <!-- Título -->
                        <div class="mb-3">
                            <label
                                for="tituloHistorial"
                                class="form-label"
                            >
                                Título obtenido
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="tituloHistorial"
                                name="titulo"
                                maxlength="150"
                                placeholder="Ej. Bachillerato"
                                required
                            >
                        </div>

                        <!-- Fecha de inicio -->
                        <div class="mb-3">
                            <label
                                for="fechaInicioHistorial"
                                class="form-label"
                            >
                                Fecha de inicio
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="fechaInicioHistorial"
                                name="fecha_inicio"
                                required
                            >
                        </div>

                        <!-- Fecha de finalización -->
                        <div class="mb-3">
                            <label
                                for="fechaFinHistorial"
                                class="form-label"
                            >
                                Fecha de finalización
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="fechaFinHistorial"
                                name="fecha_fin"
                                required
                            >
                        </div>

                        <!-- Piloto -->
                        <div class="mb-3">
                            <label
                                for="pilotoHistorial"
                                class="form-label"
                            >
                                Piloto
                            </label>

                            <select
                                class="form-select"
                                id="pilotoHistorial"
                                name="id_piloto"
                                required
                            >
                                <option value="">
                                    Selecciona un piloto...
                                </option>
                            </select>
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-success"
                            id="btnGuardarHistorial"
                        >
                            Guardar historial
                        </button>

                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Lógica del módulo -->
    <script src="../js/modulos/historial.js"></script>

    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );

        cargarComponente(
            "contenedorEncabezado",
            "../componentes/encabezado.html"
        );
    </script>

</body>
</html>
