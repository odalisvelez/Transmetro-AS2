
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Líneas | Gestión Transmetro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <br>
                        <h2>Gestión de líneas</h2>
                        <p>
                            Consulta y administra las líneas
                            registradas en el sistema.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-success"
                        id="btnNuevaLinea"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Nueva línea
                    </button>
                </div>

                <!-- Tabla de líneas -->
                <div class="module-card">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre de línea</th>
                                    <th>Municipalidad</th>
                                    <th>Estaciones activas</th>
                                    <th>Buses activos asignados</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaLineas">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        Cargando líneas...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Modal: Nueva línea / Editar línea -->
    <div
        class="modal fade"
        id="modalLinea"
        tabindex="-1"
        aria-labelledby="tituloModalLinea"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalLinea">
                        Nueva línea
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>
                </div>

                <form id="formLinea">

                    <div class="modal-body">

                        <div class="mb-3">
                            <label for="nombreLinea" class="form-label">
                                Nombre de la línea
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombreLinea"
                                name="nombre"
                                maxlength="150"
                                placeholder="Ej. Línea Central"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="municipalidadLinea"
                                class="form-label"
                            >
                                Municipalidad
                            </label>

                            <select
                                class="form-select"
                                id="municipalidadLinea"
                                name="id_municipalidad"
                                required
                            >
                                <option value="">
                                    Selecciona una municipalidad
                                </option>
                            </select>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Guardar línea
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <!-- Lógica del módulo -->
    <script src="../js/modulos/lineas.js"></script>

    <!-- Cargar menú y encabezado -->
    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );

       /*cargarComponente(
            "contenedorEncabezado",
            "../componentes/encabezado.html"
        ); */
    </script>

</body>
</html>
