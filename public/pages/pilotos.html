
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilotos | Gestión Transmetro</title>

     <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <h2>Gestión de pilotos</h2>
                        <p>
                            Consulta y administra los pilotos del transmetro.
                        </p>
                    </div>

                    <button class="btn btn-success" id="btnNuevoPiloto">
                        <i class="bi bi-plus-lg"></i>
                        Nuevo piloto
                    </button>
                </div>

                <!-- Tabla de pilotos -->
                <div class="module-card">

                    <!-- Búsqueda y cantidad de registros -->
                    <div class="row g-3 align-items-center mb-3">
                        <div class="col-12 col-md-6">
                            <label for="buscarPilotos" class="form-label">
                                Buscar piloto
                            </label>
                            <input
                                type="search"
                                class="form-control"
                                id="buscarPilotos"
                                placeholder="Buscar por nombre o ID..."
                            >
                        </div>

                        <div class="col-12 col-md-3">
                            <label for="registrosPorPaginaPilotos" class="form-label">
                                Registros por página
                            </label>
                            <select class="form-select" id="registrosPorPaginaPilotos">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre del piloto</th>
                                    <th>Dirección</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaPilotos">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        Cargando pilotos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Información y navegación de páginas -->
                    <div class="d-flex flex-column flex-md-row
                                justify-content-between align-items-center gap-3 mt-3">

                        <p
                            id="infoPaginacionPilotos"
                            class="mb-0 text-muted"
                            aria-live="polite"
                        >
                            Mostrando registros...
                        </p>

                        <nav aria-label="Paginación de pilotos">
                            <ul
                                class="pagination pagination-sm mb-0"
                                id="paginacionPilotos"
                            ></ul>
                        </nav>

                    </div>

                </div>

            </section>

        </main>

    </div>
   
    <!-- Modal: Nuevo Piloto -->
    <div class="modal fade" id="modalPiloto" tabindex="-1" aria-labelledby="tituloModalPiloto" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalPiloto">
                        Nuevo piloto
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form id="formPiloto">
                    <div class="modal-body">
                        
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombrePiloto" class="form-label">Nombre del Piloto</label>
                            <input type="text" class="form-control" id="nombrePiloto" name="nombre" maxlength="150" placeholder="Ej. Juan Carlos" required>
                        </div>

                        <!-- Dirección -->
                        <div class="mb-3">
                            <label for="direccionPiloto" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccionPiloto" name="direccion"  maxlength="200" placeholder="Ej. Zona 1, Ciudad" required>
                        </div>

                        <!-- Teléfono -->
                        <div class="mb-3">
                            <label for="telefonoPiloto" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefonoPiloto" name="telefono" maxlength="20" placeholder="Ej. 5555-5555" required>
                        </div>

                        <!-- Correo -->
                        <div class="mb-3">
                            <label for="correoPiloto" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correoPiloto" name="correo" maxlength="100" placeholder="Ej. juan@email.com">
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-success">
                            Guardar piloto
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Lógica del módulo -->
    <script src="../js/modulos/pilotos.js"></script>


    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );

        cargarComponente(
            "contenedorEncabezado",
            "../componentes/encabezado.html"
        );
    </script>

</body>
</html>
