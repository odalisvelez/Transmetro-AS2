<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parqueos | Gestión Transmetro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <br>
                        <h2>Gestión de parqueos</h2>
                        <p>
                            Consulta y administra los parqueos
                            registrados en el sistema.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-success"
                        id="btnNuevoParqueo"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Nuevo parqueo
                    </button>
                </div>

                <!-- Tabla de parqueos -->
                <div class="module-card">

                    
                    <!-- Búsqueda y cantidad de registros -->
                    <div class="row g-3 align-items-center mb-3">
                        <div class="col-12 col-md-6">
                            <label for="buscarParqueos" class="form-label">
                                Buscar parqueo
                            </label>
                            <input
                                type="search"
                                class="form-control"
                                id="buscarParqueos"
                                placeholder="Buscar por ubicación, estación o ID..."
                            >
                        </div>

                        <div class="col-12 col-md-3">
                            <label for="registrosPorPaginaParqueos" class="form-label">
                                Registros por página
                            </label>
                            <select class="form-select" id="registrosPorPaginaParqueos">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Ubicación</th>
                                    <th>Capacidad</th>
                                    <th>Estación</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaParqueos">
                                <tr>
                                    <td colspan="6" class="text-center">
                                        Cargando parqueos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    
                    <!-- Información y navegación de páginas -->
                    <div class="d-flex flex-column flex-md-row
                                justify-content-between align-items-center gap-3 mt-3">

                        <p
                            id="infoPaginacionParqueos"
                            class="mb-0 text-muted"
                            aria-live="polite"
                        >
                            Mostrando registros...
                        </p>

                        <nav aria-label="Paginación de parqueos">
                            <ul
                                class="pagination pagination-sm mb-0"
                                id="paginacionParqueos"
                            ></ul>
                        </nav>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Modal: Nuevo parqueo / Editar parqueo -->
    <div
        class="modal fade"
        id="modalParqueo"
        tabindex="-1"
        aria-labelledby="tituloModalParqueo"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalParqueo">
                        Nuevo parqueo
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>
                </div>

                <form id="formParqueo">

                    <div class="modal-body">

                        <div class="mb-3">
                            <label for="ubicacionParqueo" class="form-label">
                                Ubicación del parqueo
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="ubicacionParqueo"
                                name="ubicacion"
                                maxlength="150"
                                placeholder="Ej. Parqueo zona central"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="capacidadParqueo" class="form-label">
                                Capacidad
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="capacidadParqueo"
                                name="capacidad"
                                min="1"
                                step="1"
                                placeholder="Ej. 20"
                                required
                            >
                            <div class="form-text">
                                Cantidad máxima de buses que puede albergar.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="estacionParqueo" class="form-label">
                                Estación
                            </label>

                            <select
                                class="form-select"
                                id="estacionParqueo"
                                name="id_estacion"
                                required
                            >
                                <option value="">
                                    Selecciona una estación
                                </option>
                            </select>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-success"
                            id="btnGuardarParqueo"
                        >
                            Guardar parqueo
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <!-- Lógica del módulo -->
    <script src="../js/modulos/parqueos.js"></script>

    <!-- Cargar menú y encabezado -->
    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );

        /* Si los demás módulos muestran el encabezado,
           puedes habilitar también esta llamada. */
        /*
        cargarComponente(
            "contenedorEncabezado",
            "../componentes/encabezado.html"
        );
        */
    </script>

</body>
</html>
