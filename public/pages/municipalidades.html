
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Municipalidades | Gestión Transmetro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <h2>Gestión de municipalidades</h2>
                        <p>
                            Consulta y administra las municipalidades
                            registradas en el sistema.
                        </p>
                    </div>

                    <button class="btn btn-success" id="btnNuevaMunicipalidad">
                        <i class="bi bi-plus-lg"></i>
                        Nueva municipalidad
                    </button>
                </div>

                <!-- Tabla de municipalidades -->
                <div class="module-card">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre de municipalidad</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaMunicipalidades">
                                <tr>
                                    <td colspan="3" class="text-center">
                                        Cargando municipalidades...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </section>

        </main>

    </div>

    
<!-- Modal: Nueva municipalidad -->
<div class="modal fade" id="modalMunicipalidad" tabindex="-1"
     aria-labelledby="tituloModalMunicipalidad" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalMunicipalidad">
                    Nueva municipalidad
                </h5>

                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <form id="formMunicipalidad">

                <div class="modal-body">
                    <label for="nombreMunicipalidad" class="form-label">
                        Nombre de la municipalidad
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nombreMunicipalidad"
                           name="nombre"
                           maxlength="150"
                           placeholder="Ej. Municipalidad de Guatemala"
                           required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-success">
                        Guardar municipalidad
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Lógica del módulo -->
    <script src="../js/modulos/municipalidades.js"></script>


    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );

        cargarComponente(
            "contenedorEncabezado",
            "../componentes/encabezado.html"
        );
    </script>

</body>
</html>
