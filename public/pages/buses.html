
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buses | Gestión Transmetro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="app-container">

        <!-- Menú lateral reutilizable -->
        <div id="contenedorMenu"></div>

        <!-- Área principal -->
        <main class="main-content">

            <!-- Encabezado reutilizable -->
            <div id="contenedorEncabezado"></div>

            <!-- Contenido del módulo -->
            <section class="content-section">

                <div class="section-header">
                    <div>
                        <h2>Gestión de buses</h2>
                        <p>
                            Consulta y administra los buses registrados
                            en el sistema.
                        </p>
                    </div>

                    <button class="btn btn-success" id="btnNuevoBus">
                        <i class="bi bi-plus-lg"></i>
                        Nuevo bus
                    </button>
                </div>

                <!-- Tabla de buses -->
                <div class="module-card">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Placa</th>
                                    <th>Capacidad máxima</th>
                                    <th>Línea</th>
                                    <th>Parqueo</th>
                                    <th>Piloto</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tablaBuses">
                                <tr>
                                    <td colspan="8" class="text-center">
                                        Cargando buses...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Conexión con la API -->
    <script src="../js/api.js"></script>

    <!-- Lógica del módulo -->
    <script src="../js/modulos/buses.js"></script>

    <!-- Cargador de componentes -->
    <script src="../js/componentes.js"></script>

    <script>
        cargarComponente(
            "contenedorMenu",
            "../componentes/menu.html"
        );

        cargarComponente(
            "contenedorEncabezado",
            "../componentes/encabezado.html"
        );
    </script>

</body>
</html>
